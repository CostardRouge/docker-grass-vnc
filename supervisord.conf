[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; ── TigerVNC Server ──────────────────────────────────────────
[program:vncserver]
command=su - grassuser -c "vncserver :1 -geometry %(ENV_VNC_RESOLUTION)s -depth %(ENV_VNC_COL_DEPTH)s -localhost no"
autorestart=false
startsecs=3
stdout_logfile=/var/log/supervisor/vnc.log
stderr_logfile=/var/log/supervisor/vnc.err

; ── noVNC Web Client (browser access) ────────────────────────
[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy \
    --vnc localhost:5901 \
    --listen 0.0.0.0:6080
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err
